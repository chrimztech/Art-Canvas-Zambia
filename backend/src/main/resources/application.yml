server:
  port: ${SERVER_PORT:8090}

spring:
  application:
    name: art-canvas-zambia-backend
  # Optional, git-ignored file for secrets (payment keys, SMTP) as KEY=value lines, e.g.
  # LENCO_API_TOKEN=... — see secrets.properties.example. Real environment variables still win.
  config:
    import: optional:file:./secrets.properties
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:art_canvas_zambia}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:11111111}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  # Outgoing email over SMTP (any provider: SendGrid, Mailgun, Amazon SES, Zoho, Gmail…).
  # Leave SMTP_HOST empty in development: emails are then written to the log instead of sent.
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:true}
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 15000
      mail.smtp.writetimeout: 15000
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 15MB

app:
  # Encrypts payment keys saved in the admin panel (defaults to the JWT secret when unset).
  credentials-encryption-key: ${CREDENTIALS_ENCRYPTION_KEY:}
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-key-change-me-please-32bytes-min}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:10080}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8080,http://localhost:8081,http://127.0.0.1:8080,http://127.0.0.1:8081}
  upload:
    dir: ${UPLOAD_DIR:./uploads}
    public-base-url: ${UPLOAD_PUBLIC_BASE_URL:http://localhost:8090/uploads}
  bootstrap-admin:
    email: ${BOOTSTRAP_ADMIN_EMAIL:chrishentmatakala@yahoo.com}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:62825252Ch}
    legacy-email: ${BOOTSTRAP_ADMIN_LEGACY_EMAIL:admin@artcanvaszambia.com}
  mail:
    from: ${MAIL_FROM:ChrisEpic Arts <no-reply@chrisepicarts.com>}
  auth:
    # Sign-in uses an HttpOnly cookie. Same-site deployments (app.example.com + api.example.com) can share it
    # with the frontend server by setting AUTH_COOKIE_DOMAIN=example.com. If the frontend and API are on
    # different sites, set AUTH_COOKIE_SAME_SITE=None (requires HTTPS and AUTH_COOKIE_SECURE=true).
    cookie-domain: ${AUTH_COOKIE_DOMAIN:}
    cookie-secure: ${AUTH_COOKIE_SECURE:false}
    cookie-same-site: ${AUTH_COOKIE_SAME_SITE:Lax}
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:8080}
  backend-base-url: ${BACKEND_BASE_URL:http://localhost:8090}
  zynlepay:
    merchant-id: ${ZYNLEPAY_MERCHANT_ID:DEMO_MERCHANT}
    api-id: ${ZYNLEPAY_API_ID:DEMO_API_ID}
    api-key: ${ZYNLEPAY_API_KEY:DEMO_API_KEY}
    api-base-url: ${ZYNLEPAY_API_BASE_URL:https://sandbox.zynlepay.com/zynlepay/jsonapi}
    payment-status-url: ${ZYNLEPAY_PAYMENT_STATUS_URL:https://sandbox.zynlepay.com/zynlepay/jsonapi/paymentstatus}
    webhook-token: ${ZYNLEPAY_WEBHOOK_TOKEN:dev-only-webhook-token-change-me}
  # Lenco (https://lenco-api.readme.io/v2.0). Secrets come from the environment only; never commit them.
  # Defaults point at the sandbox; for live payments set LENCO_API_BASE_URL=https://api.lenco.co/access/v2
  # and LENCO_WIDGET_URL=https://pay.lenco.co/js/v1/inline.js.
  lenco:
    api-base-url: ${LENCO_API_BASE_URL:https://sandbox.lenco.co/access/v2}
    widget-url: ${LENCO_WIDGET_URL:https://pay.sandbox.lenco.co/js/v1/inline.js}
    api-token: ${LENCO_API_TOKEN:}
    public-key: ${LENCO_PUBLIC_KEY:}
    account-id: ${LENCO_ACCOUNT_ID:}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
