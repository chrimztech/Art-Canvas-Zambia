server:
  port: ${SERVER_PORT:8090}

spring:
  application:
    name: art-canvas-zambia-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:art_canvas_zambia}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:11111111}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 15MB

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-key-change-me-please-32bytes-min}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:10080}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8080,http://localhost:8081,http://127.0.0.1:8080,http://127.0.0.1:8081}
  upload:
    dir: ${UPLOAD_DIR:./uploads}
    public-base-url: ${UPLOAD_PUBLIC_BASE_URL:http://localhost:8090/uploads}
  bootstrap-admin:
    email: ${BOOTSTRAP_ADMIN_EMAIL:chrishentmatakala@yahoo.com}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:62825252Ch}
    legacy-email: ${BOOTSTRAP_ADMIN_LEGACY_EMAIL:admin@artcanvaszambia.com}
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:8080}
  backend-base-url: ${BACKEND_BASE_URL:http://localhost:8090}
  zynlepay:
    merchant-id: ${ZYNLEPAY_MERCHANT_ID:DEMO_MERCHANT}
    api-id: ${ZYNLEPAY_API_ID:DEMO_API_ID}
    api-key: ${ZYNLEPAY_API_KEY:DEMO_API_KEY}
    api-base-url: ${ZYNLEPAY_API_BASE_URL:https://sandbox.zynlepay.com/zynlepay/jsonapi}
    payment-status-url: ${ZYNLEPAY_PAYMENT_STATUS_URL:https://sandbox.zynlepay.com/zynlepay/jsonapi/paymentstatus}
    webhook-token: ${ZYNLEPAY_WEBHOOK_TOKEN:dev-only-webhook-token-change-me}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
